name: Play Store screenshots

# Run by hand from the Actions tab. Opens the live web app at phone size,
# takes 1080x1920 screenshots with real Gurbani from BaniDB, and attaches
# them to the "store-screenshots" pre-release for easy download.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.64.1
          npx playwright install --with-deps chromium

      - name: Take screenshots
        run: node store/screenshots.mjs "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" screenshots

      - name: Publish screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete store-screenshots --yes --cleanup-tag || true
          gh release create store-screenshots screenshots/*.png \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Play Store screenshots" \
            --notes "Phone screenshots (1080x1920) for the Google Play listing."

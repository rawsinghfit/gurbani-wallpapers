name: Build Gurbani Wallpapers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android and web platform folders
        run: flutter create . --platforms=android,web --org com.gurbaniwallpapers --project-name gurbani_wallpapers

      - name: Set app name and internet permission
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$MANIFEST"
          fi
          sed -i 's|android:label="[^"]*"|android:label="Gurbani Wallpapers"|' "$MANIFEST"
          sed -i 's|<title>[^<]*</title>|<title>Gurbani Wallpapers</title>|; s|apple-mobile-web-app-title" content="[^"]*"|apple-mobile-web-app-title" content="Gurbani Wallpapers"|' web/index.html
          sed -i 's|"name": "[^"]*"|"name": "Gurbani Wallpapers"|; s|"short_name": "[^"]*"|"short_name": "Gurbani"|; s|"background_color": "[^"]*"|"background_color": "#0E1B2C"|; s|"theme_color": "[^"]*"|"theme_color": "#0E1B2C"|; s|"description": "[^"]*"|"description": "Turn a line of Gurbani into a wallpaper or status."|' web/manifest.json
          cat "$MANIFEST"

      - name: Get packages
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Android app
        uses: actions/upload-artifact@v4
        with:
          name: android-test-app
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Build web app
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Upload web app for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-web:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: gurbani_wallpapers
description: "Find a line of Gurbani and turn it into a wallpaper or status."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  gal: ^2.3.3
  google_fonts: ^8.2.1
  google_mobile_ads: ^9.2.0
  http: ^1.6.0
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# App icons, generated in the cloud after `flutter create` (see build.yml).
flutter_launcher_icons:
  image_path: "store/app-icon-1024.png"
  android: true
  ios: false
  min_sdk_android: 24
  adaptive_icon_background: "#172B45"
  adaptive_icon_foreground: "store/app-icon-foreground.png"
  web:
    generate: true
    image_path: "store/app-icon-1024.png"
    background_color: "#0E1B2C"
    theme_color: "#0E1B2C"
